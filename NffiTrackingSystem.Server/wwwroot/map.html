<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>NFFI Live Tracking</title>
    <!-- Leaflet CSS (used for the OpenStreetMap fallback) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: Segoe UI, sans-serif; }
        #map { height: 100%; width: 100%; }

        /* Bottom-left status: units count + last position */
        #info {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.78); color: #fff; padding: 6px 12px;
            font-family: Consolas, monospace; font-size: 12px; border-radius: 4px;
            z-index: 9999;
        }

        /* Top-right badge: which map provider is active */
        #badge {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.78); color: #0f0; padding: 6px 10px;
            font-family: Consolas, monospace; font-size: 11px; border-radius: 4px;
            z-index: 9999;
        }

        /* Label shown next to each vehicle marker */
        .veh-label {
            background: rgba(0,0,0,0.85); color: #fff; padding: 2px 7px;
            border-radius: 4px; font-size: 11px; font-weight: bold;
            font-family: Consolas, monospace; white-space: nowrap;
            border: 1px solid #fff;
        }
    </style>
</head>
<body>
    <!-- Map canvas -->
    <div id="map"></div>

    <!-- Status overlays -->
    <div id="info">Waiting for data...</div>
    <div id="badge">-</div>

    <script>
        // ============================================================
        // Global state
        // ============================================================
        let map = null;                     // Google Maps or Leaflet map instance
        let mode = 'leaflet';               // 'google' or 'leaflet'
        let apiKey = '';                    // Google Maps API key from query string
        let useOffline = false;             // Force OpenStreetMap when true
        let mapReady = false;               // Set to true after the map signals "ready"
        const pending = [];                 // Messages buffered before the map is ready
        const vehicles = {};                // unitId -> vehicle state (marker, route, ...)
        const histories = {};               // unitId -> array of {t, lat, lon} for replay

        // Parse query string: ?apikey=...&offline=1
        const params = new URLSearchParams(window.location.search);
        apiKey = params.get('apikey') || '';
        useOffline = params.get('offline') === '1';
        if (!useOffline && apiKey && apiKey.startsWith('AIza')) mode = 'google';

        // Update the top-right badge with the active provider
        document.getElementById('badge').innerText =
            mode === 'google' ? 'Google Maps' : 'OpenStreetMap';

        // Color palette used for distinct per-vehicle colors
        const palette = ['#e6194b','#3cb44b','#4363d8','#f58231',
                         '#911eb4','#46f0f0','#f032e6','#bcf60c',
                         '#008080','#9a6324','#800000','#000075'];

        // Deterministic color per unitId (same color in client and server)
        function getColor(unitId) {
            let h = 0;
            for (let i = 0; i < unitId.length; i++)
                h = (h * 31 + unitId.charCodeAt(i)) >>> 0;
            return palette[h % palette.length];
        }

        // HTML-escape helper (avoid XSS when rendering labels)
        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[<>&"]/g, c => ({
                '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'
            }[c]));
        }

        // Called once the map provider finishes loading.
        // Flushes buffered messages and notifies the C# host.
        function signalReady() {
            mapReady = true;
            for (const m of pending) processMessage(m);
            pending.length = 0;
            try {
                if (window.chrome && window.chrome.webview)
                    window.chrome.webview.postMessage({ type: 'ready', mode: mode });
            } catch (e) { console.error('postMessage ready failed', e); }
        }

        // ============================================================
        // Map initialization
        // ============================================================
        function initGoogleMaps() {
            try {
                map = new google.maps.Map(document.getElementById('map'), {
                    zoom: 8,
                    center: { lat: 45.8, lng: 25.0 },
                    mapTypeId: 'roadmap'
                });
                signalReady();
            } catch (e) { console.error('initGoogleMaps failed', e); }
        }

        function initLeaflet() {
            try {
                map = L.map('map', { zoomControl: true }).setView([45.8, 25.0], 7);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap'
                }).addTo(map);
                signalReady();
            } catch (e) { console.error('initLeaflet failed', e); }
        }

        // ============================================================
        // Vehicle state
        // ============================================================
        function getOrCreateVehicle(unitId) {
            if (vehicles[unitId]) return vehicles[unitId];
            const v = {
                unitId: unitId,
                color: getColor(unitId),
                routePoints: [],        // planned route [[lat,lon], ...]
                routeLine: null,        // polyline for the planned route
                polyline: null,         // polyline used during replay
                marker: null,           // Google Marker or Leaflet Marker
                currentLat: null,       // last committed target position
                currentLon: null,
                renderedLat: null,      // currently drawn position (during animation)
                renderedLon: null,
                heading: 0,
                animId: null            // requestAnimationFrame handle
            };
            vehicles[unitId] = v;
            return v;
        }

        // HTML for the vehicle marker: circle + heading arrow + label
        function carIconHtml(color, heading, label) {
            const h = ((heading == null ? 0 : heading) % 360 + 360) % 360;
            const safe = escapeHtml(label);
            return '<div style="position:relative;width:36px;height:36px">' +
                   '<svg width="36" height="36" viewBox="-18 -18 36 36" ' +
                   'style="filter:drop-shadow(0 1px 3px rgba(0,0,0,0.6))">' +
                   '<g transform="rotate(' + h + ')">' +
                   '<circle cx="0" cy="0" r="12" fill="' + color + '" ' +
                   'stroke="white" stroke-width="2.5"/>' +
                   '<path d="M 0 -8 L 5 7 L 0 4 L -5 7 Z" fill="white"/>' +
                   '</g></svg>' +
                   '<div class="veh-label" style="position:absolute;left:40px;top:8px">' +
                   safe + '</div></div>';
        }

        // Create the marker (Google or Leaflet) for the first time
        function buildMarker(v, lat, lon) {
            const pos = mode === 'google' ? { lat: lat, lng: lon } : [lat, lon];
            if (mode === 'google') {
                v.marker = new google.maps.Marker({
                    position: pos, map: map,
                    icon: {
                        path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                        scale: 5, fillColor: v.color,
                        fillOpacity: 1, strokeColor: 'white', strokeWeight: 2
                    },
                    label: { text: v.unitId, className: 'veh-label' },
                    zIndex: 1000
                });
            } else {
                v.marker = L.marker(pos, {
                    icon: L.divIcon({
                        className: '',
                        html: carIconHtml(v.color, v.heading, v.unitId),
                        iconSize: [36, 36],
                        iconAnchor: [18, 18]
                    }),
                    zIndexOffset: 1000
                }).addTo(map);
            }
        }

        // Move the marker to (lat, lon)
        function updateMarkerPosition(v, lat, lon) {
            if (mode === 'google') {
                if (!v.marker) buildMarker(v, lat, lon);
                else v.marker.setPosition({ lat: lat, lng: lon });
            } else {
                if (!v.marker) buildMarker(v, lat, lon);
                else v.marker.setLatLng([lat, lon]);
            }
        }

        // Rebuild the Leaflet icon so the arrow reflects the new heading
        function updateMarkerIcon(v) {
            if (mode !== 'leaflet' || !v.marker) return;
            v.marker.setIcon(L.divIcon({
                className: '',
                html: carIconHtml(v.color, v.heading, v.unitId),
                iconSize: [36, 36],
                iconAnchor: [18, 18]
            }));
        }

        // ============================================================
        // Route (single solid colored line, drawn once)
        // ============================================================
        function removeRouteLayer(v) {
            if (v.routeLine) {
                if (mode === 'google') v.routeLine.setMap(null);
                else map.removeLayer(v.routeLine);
                v.routeLine = null;
            }
        }

        function setRoute(unitId, points) {
            console.log('setRoute:', unitId, points.length, 'points');
            const v = getOrCreateVehicle(unitId);
            v.routePoints = points.map(p => [p.lat, p.lon]);
            removeRouteLayer(v);

            if (v.routePoints.length < 2) {
                console.log('Route has < 2 points, skip.');
                return;
            }

            // Draw the route in the vehicle's color
            if (mode === 'google') {
                v.routeLine = new google.maps.Polyline({
                    path: v.routePoints.map(p => ({ lat: p[0], lng: p[1] })),
                    geodesic: true,
                    strokeColor: v.color,
                    strokeOpacity: 1.0,
                    strokeWeight: 4,
                    map: map,
                    zIndex: 5
                });
            } else {
                v.routeLine = L.polyline(v.routePoints, {
                    color: v.color,
                    weight: 4,
                    opacity: 1.0,
                    lineCap: 'round',
                    lineJoin: 'round'
                }).addTo(map);
            }

            console.log('Route drawn for', unitId);

            // Auto-fit after all routes are drawn (200 ms grace period)
            setTimeout(fitAllRoutes, 200);
        }

        // ============================================================
        // Auto-fit to the bounding box of ALL routes
        // ============================================================
        function fitAllRoutes() {
            const all = [];
            for (const id in vehicles) {
                const v = vehicles[id];
                if (v.routePoints && v.routePoints.length > 0) {
                    for (const p of v.routePoints) all.push(p);
                }
            }
            if (all.length < 2) return;

            const lats = all.map(p => p[0]);
            const lons = all.map(p => p[1]);
            const minLat = Math.min.apply(null, lats);
            const maxLat = Math.max.apply(null, lats);
            const minLon = Math.min.apply(null, lons);
            const maxLon = Math.max.apply(null, lons);

            console.log('Fitting to bounds:', minLat, minLon, maxLat, maxLon);

            try {
                if (mode === 'google') {
                    const bounds = new google.maps.LatLngBounds(
                        { lat: minLat, lng: minLon },
                        { lat: maxLat, lng: maxLon });
                    map.fitBounds(bounds, 60);
                } else {
                    map.fitBounds([[minLat, minLon], [maxLat, maxLon]],
                                  { padding: [60, 60] });
                }
                console.log('Fitted to bounds');
            } catch (e) { console.warn('fitBounds failed:', e); }
        }

        // ============================================================
        // Marker animation
        // ============================================================
        // Animates from the CURRENT RENDERED position to (targetLat, targetLon)
        // over durationMs. Using renderedLat/renderedLon prevents the marker
        // from jumping back when a new message arrives mid-animation.
        function animateMarker(v, targetLat, targetLon, durationMs) {
            if (v.animId) cancelAnimationFrame(v.animId);

            // Pick the start point: rendered -> current -> target (in this order)
            const sLat = (v.renderedLat != null) ? v.renderedLat
                       : (v.currentLat != null) ? v.currentLat : targetLat;
            const sLon = (v.renderedLon != null) ? v.renderedLon
                       : (v.currentLon != null) ? v.currentLon : targetLon;

            const t0 = performance.now();
            function step(now) {
                const t = Math.min(1, (now - t0) / durationMs);
                const lat = sLat + (targetLat - sLat) * t;
                const lon = sLon + (targetLon - sLon) * t;

                // Track where we are actually drawing right now
                v.renderedLat = lat;
                v.renderedLon = lon;

                updateMarkerPosition(v, lat, lon);
                if (t < 1) {
                    v.animId = requestAnimationFrame(step);
                } else {
                    // Animation complete: commit both target and rendered
                    v.currentLat = targetLat;
                    v.currentLon = targetLon;
                    v.renderedLat = targetLat;
                    v.renderedLon = targetLon;
                    v.animId = null;
                }
            }
            v.animId = requestAnimationFrame(step);
        }

        // Handle a new position message for a vehicle
        function updateVehicle(unitId, lat, lon, heading, animate, durationMs) {
            const v = getOrCreateVehicle(unitId);
            const isFirst = (v.currentLat == null);
            if (typeof heading === 'number') v.heading = heading;

            if (isFirst) {
                // First message: place marker immediately, no animation
                v.currentLat = lat; v.currentLon = lon;
                v.renderedLat = lat; v.renderedLon = lon;
                updateMarkerPosition(v, lat, lon);

                // If we don't have a route yet, center the map on the vehicle
                if (!v.routeLine) {
                    if (mode === 'google') { map.setCenter({ lat: lat, lng: lon }); map.setZoom(10); }
                    else { map.setView([lat, lon], 10); }
                }
            } else if (animate) {
                // Smooth transition from current rendered position
                animateMarker(v, lat, lon, durationMs || 1000);
                updateMarkerIcon(v);
            } else {
                // Jump directly to the new position
                v.currentLat = lat; v.currentLon = lon;
                v.renderedLat = lat; v.renderedLon = lon;
                updateMarkerPosition(v, lat, lon);
                updateMarkerIcon(v);
            }

            document.getElementById('info').innerText =
                'Units: ' + Object.keys(vehicles).length +
                '  |  Latest: ' + unitId +
                '  (' + lat.toFixed(5) + ', ' + lon.toFixed(5) + ')';
        }

        // ============================================================
        // Clear / remove
        // ============================================================
        function clearAll() {
            for (const id in vehicles) {
                const v = vehicles[id];
                if (v.marker) {
                    if (mode === 'google') v.marker.setMap(null);
                    else map.removeLayer(v.marker);
                }
                removeRouteLayer(v);
                if (v.polyline) {
                    if (mode === 'google') v.polyline.setMap(null);
                    else map.removeLayer(v.polyline);
                }
            }
            for (const k in vehicles) delete vehicles[k];
            document.getElementById('info').innerText = 'Map cleared.';
        }

        function removeVehicle(unitId) {
            const v = vehicles[unitId];
            if (!v) return;
            if (v.marker) {
                if (mode === 'google') v.marker.setMap(null);
                else map.removeLayer(v.marker);
            }
            removeRouteLayer(v);
            if (v.polyline) {
                if (mode === 'google') v.polyline.setMap(null);
                else map.removeLayer(v.polyline);
            }
            delete vehicles[unitId];
        }

        // ============================================================
        // Replay (server sends full history, then seek(t) frames)
        // ============================================================
        function setHistoryData(unitId, points) {
            histories[unitId] = points.slice().sort((a,b) => a.t < b.t ? -1 : 1);
        }

        function seekToTime(isoTs) {
            for (const unitId in histories) {
                const all = histories[unitId];
                const visible = [];
                for (let i = 0; i < all.length; i++) {
                    if (all[i].t <= isoTs) visible.push(all[i]);
                    else break;
                }
                const v = getOrCreateVehicle(unitId);

                // Replay uses a single progressive polyline (no route/trail)
                removeRouteLayer(v);
                const pts = visible.map(p => [p.lat, p.lon]);

                if (mode === 'google') {
                    if (!v.polyline) {
                        v.polyline = new google.maps.Polyline({
                            path: [], geodesic: true, strokeColor: v.color,
                            strokeOpacity: 0.9, strokeWeight: 4, map: map
                        });
                    }
                    v.polyline.setPath(pts.map(p => ({ lat: p[0], lng: p[1] })));
                } else {
                    if (!v.polyline) {
                        v.polyline = L.polyline([], {
                            color: v.color, weight: 4, opacity: 0.9
                        }).addTo(map);
                    }
                    v.polyline.setLatLngs(pts);
                }

                // Move the marker to the last visible point
                if (visible.length > 0) {
                    const last = visible[visible.length - 1];
                    v.currentLat = last.lat; v.currentLon = last.lon;
                    v.renderedLat = last.lat; v.renderedLon = last.lon;
                    updateMarkerPosition(v, last.lat, last.lon);
                } else {
                    // Nothing visible yet: hide marker and polyline
                    if (v.marker) {
                        if (mode === 'google') v.marker.setMap(null);
                        else map.removeLayer(v.marker);
                        v.marker = null;
                    }
                    if (v.polyline) {
                        if (mode === 'google') v.polyline.setMap(null);
                        else map.removeLayer(v.polyline);
                        v.polyline = null;
                    }
                }
            }
            document.getElementById('info').innerText = 'Replay @ ' + isoTs;
        }

        // ============================================================
        // Message dispatcher
        // ============================================================
        function processMessage(raw) {
            try {
                const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
                if (!data || !data.type) return;
                console.log('MAP RX', data.type);

                if (data.type === 'route') {
                    setRoute(data.unitId, data.points || []);
                } else if (data.type === 'position') {
                    updateVehicle(data.unitId, data.lat, data.lon,
                        data.heading, data.animate !== false,
                        data.durationMs || 1000);
                } else if (data.type === 'clear') {
                    clearAll();
                } else if (data.type === 'remove') {
                    removeVehicle(data.unitId);
                } else if (data.type === 'setHistory') {
                    setHistoryData(data.unitId, data.points || []);
                } else if (data.type === 'clearHistory') {
                    for (const k in histories) delete histories[k];
                } else if (data.type === 'seek') {
                    seekToTime(data.t);
                } else if (data.type === 'fitAll') {
                    fitAllRoutes();
                }
            } catch (e) { console.error('Invalid message:', e, raw); }
        }

        // Messages arriving before the map is ready are queued
        function onWebViewMessage(event) {
            if (!mapReady) { pending.push(event.data); return; }
            processMessage(event.data);
        }

        // WebView2 sends messages via window.chrome.webview
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', onWebViewMessage);
            console.log('WebView2 listener attached');
        } else {
            // Fallback for plain browser testing
            window.addEventListener('message', onWebViewMessage);
            console.log('window.message listener attached (non-WebView2)');
        }

        // ============================================================
        // Load the map provider
        // ============================================================
        function loadLeaflet() {
            const s = document.createElement('script');
            s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
            s.onload = initLeaflet;
            s.onerror = () => {
                document.getElementById('info').innerText =
                    'ERROR: Cannot load Leaflet from unpkg.com';
            };
            document.head.appendChild(s);
        }

        if (mode === 'google') {
            const s = document.createElement('script');
            s.src = 'https://maps.googleapis.com/maps/api/js?key=' +
                    encodeURIComponent(apiKey) + '&callback=initGoogleMaps';
            s.async = true; s.defer = true;
            s.onerror = () => {
                console.warn('Google Maps failed, falling back to Leaflet.');
                mode = 'leaflet';
                document.getElementById('badge').innerText = 'OpenStreetMap (fallback)';
                loadLeaflet();
            };
            document.head.appendChild(s);
        } else {
            loadLeaflet();
        }
    </script>
</body>
</html>
